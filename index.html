<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Companion</title><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5C2D46"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#FAEBD7;--ink:#3A1F2B;--plum:#5C2D46;--gold:#E8A33D;--orange:#D9652B;--red:#B5402E;--teal:#2F7F7A;--card:#FFF4E3;--soft:#F3D9B8;--sage:#7C8B4E}
*{box-sizing:border-box}h1:focus,h2:focus{outline:none}a{color:var(--plum)}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:26px/1.45 Georgia,"Times New Roman",serif;padding-bottom:120px}
h1{font-size:46px;margin:.3em 0;line-height:1.15}h2{font-size:40px;margin:.3em 0;line-height:1.15}h3{font-size:32px;margin:.4em 0}
main{max-width:820px;margin:auto;padding:18px}p{margin:.4em 0}
button,.btn{font:inherit;font-size:28px;border:0;border-radius:22px;padding:20px;min-height:84px;cursor:pointer;color:var(--card);background:var(--plum);width:100%;margin:8px 0;display:block;text-align:center;text-decoration:none;line-height:1.2}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:6px solid var(--gold);outline-offset:3px}
.big{font-size:50px;min-height:160px;font-weight:bold}.pills{background:var(--orange)}.bills{background:var(--teal)}.talk{background:var(--gold);color:var(--ink)}
.helpnow{background:var(--red)}.sage{background:var(--sage)}.light{background:var(--soft);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid button,.grid .btn{margin:0;min-height:120px;font-size:30px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:14px 0;border:3px solid var(--soft)}
.warn{border-color:var(--orange)}.good{border-color:var(--teal)}
input,textarea,select{font:inherit;font-size:26px;width:100%;padding:14px;border-radius:14px;border:3px solid var(--gold);background:var(--card);color:var(--ink);margin:6px 0;min-height:64px}
input[type=checkbox],input[type=radio]{width:44px;height:44px;min-height:44px;flex:none;accent-color:var(--plum)}
label{display:block;margin-top:10px}.check{display:flex;gap:16px;align-items:center;margin:12px 0}
.next{font-size:54px;font-weight:bold;color:var(--orange);text-align:center;margin:.2em 0}
.huge{font-size:96px;font-weight:bold;text-align:center;color:var(--plum);line-height:1.05}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 200px}.note{color:var(--plum);font-style:italic}
summary{font-size:30px;cursor:pointer;padding:10px 0;min-height:60px}
.photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);flex:none}
.person{display:flex;gap:16px;align-items:center;text-decoration:none}
.done{text-decoration:line-through;opacity:.6}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--soft);padding:12px;text-align:center;font-size:24px}
footer a{color:var(--plum);margin:0 14px;font-weight:bold;display:inline-block;padding:8px}
#over{position:fixed;inset:0;background:var(--orange);color:var(--card);padding:30px;display:none;overflow:auto;z-index:9}
#over h1{font-size:60px}#over li{font-size:36px;margin:10px 0}#over button{background:var(--card);color:var(--plum);font-size:40px;min-height:120px}
#lamp{position:fixed;inset:0;background:#FFF7E6;display:none;z-index:10}#lamp button{position:absolute;bottom:40px;left:5%;width:90%;background:var(--plum)}
@media print{footer,button,.btn,#over,.noprint{display:none!important}body{background:#FFFDF8;font-size:16pt;padding:0}.card{border:1px solid #999}}
</style></head><body>
<main id="view" aria-live="polite"></main>
<div id="over" role="alertdialog" aria-modal="true" aria-label="Reminder"></div>
<div id="lamp" aria-label="Light"><button onclick="lampOff()">Turn the light off</button></div>
<footer aria-label="Help any time">Need someone now? <a href="tel:988">Call 988</a><a href="sms:988">Text 988</a><a href="tel:911">Call 911</a></footer>
<script src="app.js"></script></body></html>
